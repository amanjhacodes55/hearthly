  schemas:
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      examples: [66f1a2b3c4d5e6f7a8b9c0d1]
    DateTime:
      type: string
      format: date-time
    Scope:
      type: string
      enum: [conversations:read, conversations:write, messages:write, contacts:read, contacts:write, webhooks:manage, website:read]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, insufficient_scope, not_found, bad_request, validation_failed, rate_limited, server_error]
            message: { type: string }
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_client, invalid_grant, invalid_request, unsupported_grant_type, slow_down, server_error]
        error_description: { type: string }
    Pagination:
      type: object
      required: [page, limit, total, has_more]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    Contact:
      type: object
      required: [id, email, name, phone, company, avatar, tags, data, geo, device, referrer, utm, current_page, sessions, page_views, events, source, external_id, first_seen_at, last_seen_at, online, created_at]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        email: { type: string, description: Lower-cased; empty string if unknown. }
        name: { type: string }
        phone: { type: string }
        company: { type: string }
        avatar: { type: string }
        tags:
          type: array
          items: { type: string }
        data:
          type: object
          description: Custom attributes.
          additionalProperties:
            type: [string, number, boolean, 'null']
        geo:
          type: object
          required: [country, country_name, city, timezone, locale]
          properties:
            country: { type: string, description: ISO country code. }
            country_name: { type: string }
            city: { type: string }
            timezone: { type: string }
            locale: { type: string }
        device:
          type: object
          required: [browser, browser_version, os, os_version, type]
          properties:
            browser: { type: string }
            browser_version: { type: string }
            os: { type: string }
            os_version: { type: string }
            type: { type: string, description: 'desktop, mobile, tablet, bot, or empty.' }
        referrer: { type: string }
        utm:
          type: object
          required: [source, medium, campaign, term, content]
          properties:
            source: { type: string }
            medium: { type: string }
            campaign: { type: string }
            term: { type: string }
            content: { type: string }
        current_page:
          oneOf:
            - type: object
              required: [url, title, since]
              properties:
                url: { type: string }
                title: { type: string }
                since: { type: [string, 'null'], format: date-time }
            - type: 'null'
        sessions: { type: integer }
        page_views: { type: integer }
        events:
          type: array
          description: Names of tracked events performed.
          items: { type: string }
        source: { type: string, description: 'widget, api, manual, import, or channel:<name>.' }
        external_id: { type: string, description: 'Your ID for the contact. Inbound-created contacts use `<channel>:<id>`.' }
        first_seen_at: { type: [string, 'null'], format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        online: { type: boolean, description: last_seen_at less than 75 seconds ago. }
        created_at: { type: [string, 'null'], format: date-time }
    ContactInput:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 200 }
        name: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        company: { type: string, maxLength: 100 }
        tags:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 40 }
        data:
          type: object
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 500 }
              - { type: number }
              - { type: boolean }
              - { type: 'null' }
        external_id: { type: string, maxLength: 100 }
    Conversation:
      type: object
      required: [id, status, snoozed_until, assignee_id, tags, subject, channel, last_message, unread, visitor_unread, visitor_read_at, rating, first_response_at, resolved_at, created_at, updated_at, contact_id]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        status: { type: string, enum: [open, pending, resolved] }
        snoozed_until: { type: [string, 'null'], format: date-time }
        assignee_id:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        tags:
          type: array
          items: { type: string }
        subject: { type: string }
        channel: { type: string, description: 'widget, campaign, or a custom inbound channel name.' }
        last_message:
          oneOf:
            - type: object
              required: [text, from, at]
              properties:
                text: { type: string, maxLength: 140 }
                from: { type: string, enum: [visitor, operator, bot] }
                at: { type: string, format: date-time }
            - type: 'null'
        unread: { type: integer, description: Visitor messages unread by the team. }
        visitor_unread: { type: integer, description: Operator/bot messages unread by the visitor. }
        visitor_read_at: { type: [string, 'null'], format: date-time }
        rating:
          oneOf:
            - type: object
              required: [score, comment, at]
              properties:
                score: { type: number }
                comment: { type: string }
                at: { type: [string, 'null'], format: date-time }
            - type: 'null'
        first_response_at: { type: [string, 'null'], format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contact_id: { $ref: '#/components/schemas/ObjectId' }
        contact: { $ref: '#/components/schemas/Contact' }
    VisitorConversation:
      type: object
      description: The slice of a conversation a visitor may see.
      required: [id, status, unread, rating, created_at]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        status: { type: string, enum: [open, pending, resolved] }
        unread: { type: integer, description: Messages unread by the visitor. }
        rating:
          oneOf:
            - type: object
              properties:
                score: { type: number }
                comment: { type: string }
                at: { type: [string, 'null'], format: date-time }
            - type: 'null'
        created_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversation_id, from, author, text, attachments, actions, via, created_at]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        conversation_id: { $ref: '#/components/schemas/ObjectId' }
        from: { type: string, enum: [visitor, operator, bot, system, note] }
        author:
          oneOf:
            - type: object
              required: [id, name, avatar]
              properties:
                id: { type: [string, 'null'], description: 'User/contact ID, or `api_key:<id>` / `app:<id>` for API-sent messages.' }
                name: { type: string }
                avatar: { type: string }
            - type: 'null'
        text: { type: string }
        attachments:
          type: array
          items:
            type: object
            required: [id, name, size, type]
            properties:
              id: { type: string }
              name: { type: string }
              size: { type: number, description: Bytes. }
              type: { type: string, description: MIME type. }
        actions:
          type: array
          description: Quick-reply buttons offered with bot messages.
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
        via: { type: string, description: 'API key / app name, or `<channel> (<key name>)` for inbound messages.' }
        created_at: { type: string, format: date-time }
    Website:
      type: object
      required: [id, internal_id, name, domain, members, online, within_hours, created_at]
      properties:
        id: { type: string, description: Public website ID (used in the widget snippet). }
        internal_id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        domain: { type: string }
        members: { type: integer, description: Number of team members. }
        online: { type: boolean, description: Within hours and at least one agent connected. }
        within_hours: { type: boolean }
        created_at: { type: string, format: date-time }
    WebhookEvent:
      type: string
      enum: [message.received, message.sent, conversation.created, conversation.resolved, contact.created, contact.updated, visitor.identified, rating.submitted, campaign.sent]
    Webhook:
      type: object
      required: [id, url, events, description, active, secret_hint, created_via, failures, created_at]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEvent' }
        description: { type: string }
        active: { type: boolean }
        secret_hint: { type: string, description: First characters of the signing secret. }
        created_via: { type: string, description: '`dashboard`, `api:<key name>` or `app:<app name>`.' }
        failures: { type: integer, description: Consecutive failed deliveries. }
        created_at: { type: string, format: date-time }
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string, description: 'authorization_code grant: the `hly_code_…` code.' }
        redirect_uri: { type: string, description: 'authorization_code grant: required, must match.' }
        code_verifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$', description: PKCE verifier. }
        refresh_token: { type: string, description: 'refresh_token grant: the `hly_rt_…` token.' }
        client_id: { type: string, description: Required unless sent via HTTP Basic. }
        client_secret: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope, website_id]
      properties:
        access_token: { type: string, description: '`hly_at_…`' }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 3600 }
        refresh_token: { type: string, description: '`hly_rt_…`, valid 90 days, rotated on use.' }
