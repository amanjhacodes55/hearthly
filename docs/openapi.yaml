openapi: 3.1.0
info:
  title: Hearthly API
  version: 1.0.0
  summary: Public REST API v1 and OAuth 2.0 endpoints of Hearthly, the open-source live chat & customer messaging platform.
  description: |
    The public, stable surface of the Hearthly API: REST v1 (`/api/v1/**`) and the OAuth 2.0 token endpoints.

    **Authentication.** Send `Authorization: Bearer <token>` where the token is either a workspace API key
    (`hly_key_…`, created in Settings → API, with a chosen set of scopes) or an OAuth access token (`hly_at_…`,
    obtained through the authorization-code flow). Every token belongs to exactly one website (workspace); all
    requests act on that website.

    **Errors.** REST v1 errors always have the shape `{ "error": { "code", "message" } }`. Codes:
    `unauthorized` (401), `insufficient_scope` (403), `not_found` (404), `bad_request` (400/413),
    `validation_failed` (422), `rate_limited` (429), `server_error` (500).
    The OAuth endpoints use RFC 6749 errors instead: `{ "error", "error_description"? }`.

    **Rate limits.** 120 requests burst, refilling at 2 requests/second, per token. Responses carry
    `X-RateLimit-Limit` and `X-RateLimit-Remaining`; a 429 also carries `Retry-After` (seconds).

    **Bodies.** JSON, max 256 KB.

    **Pagination.** List endpoints take `page` (default 1) and `limit` (default 20, max 100) and return a
    `pagination` object `{ page, limit, total, has_more }`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:3005
    description: Local development
  - url: https://{host}
    description: Your Hearthly deployment
    variables:
      host:
        default: YOUR-HOST
        description: Hostname of your Hearthly instance.
tags:
  - name: Conversations
  - name: Messages
  - name: Contacts
  - name: Website
  - name: Webhooks
  - name: Inbound
    description: Custom channel bridge — post visitor messages from any channel.
  - name: OAuth
security:
  - bearerAuth: []
paths:
  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations
      description: Conversations of the token's website, most recently updated first. Each item embeds its contact.
      security:
        - bearerAuth: []
        - oauth2: [conversations:read]
      x-required-scope: conversations:read
      parameters:
        - name: status
          in: query
          description: Filter by status. Other values are ignored.
          schema: { type: string, enum: [open, pending, resolved] }
        - name: contact_id
          in: query
          description: Only conversations of this contact (24-hex ID; ignored if malformed).
          schema: { $ref: '#/components/schemas/ObjectId' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of conversations.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                data:
                  - $ref: '#/components/examples/ConversationValue/value'
                pagination: { page: 1, limit: 20, total: 1, has_more: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation
      security:
        - bearerAuth: []
        - oauth2: [conversations:read]
      x-required-scope: conversations:read
      responses:
        '200':
          description: The conversation, with its contact embedded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
              examples:
                conversation:
                  value:
                    data:
                      id: 66f1a2b3c4d5e6f7a8b9c0d1
                      status: open
                      snoozed_until: null
                      assignee_id: 66e0aa11bb22cc33dd44ee55
                      tags: [billing]
                      subject: ''
                      channel: widget
                      last_message: { text: Can I switch to annual billing?, from: visitor, at: '2026-10-14T09:12:40.000Z' }
                      unread: 1
                      visitor_unread: 0
                      visitor_read_at: null
                      rating: null
                      first_response_at: null
                      resolved_at: null
                      created_at: '2026-10-14T09:12:40.000Z'
                      updated_at: '2026-10-14T09:12:40.000Z'
                      contact_id: 66f1a2b3c4d5e6f7a8b9c0c1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: Update a conversation
      description: |
        Change status, tags or assignee. Resolving fires the `conversation.resolved` webhook. Setting `open` or
        `resolved` clears any snooze. An empty body returns the conversation unchanged.
      security:
        - bearerAuth: []
        - oauth2: [conversations:write]
      x-required-scope: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [open, pending, resolved]
                tags:
                  type: array
                  description: Replaces the tag list.
                  maxItems: 20
                  items: { type: string, maxLength: 40 }
                assignee_id:
                  description: User ID of a team member, or null to unassign.
                  oneOf:
                    - $ref: '#/components/schemas/ObjectId'
                    - type: 'null'
            example:
              status: resolved
              tags: [billing, annual-plan]
      responses:
        '200':
          description: The updated conversation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages of a conversation
      description: |
        Page 1 holds the most recent messages; within a page, messages are ordered oldest → newest.
        Private notes (`from: note`) and system lines (`from: system`) are included.
      security:
        - bearerAuth: []
        - oauth2: [conversations:read]
      x-required-scope: conversations:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                data:
                  - id: 66f1a2b3c4d5e6f7a8b9c101
                    conversation_id: 66f1a2b3c4d5e6f7a8b9c0d1
                    from: visitor
                    author: { id: 66f1a2b3c4d5e6f7a8b9c0c1, name: Maya Fischer, avatar: '' }
                    text: Can I switch to annual billing?
                    attachments: []
                    actions: []
                    via: ''
                    created_at: '2026-10-14T09:12:40.000Z'
                  - id: 66f1a2b3c4d5e6f7a8b9c103
                    conversation_id: 66f1a2b3c4d5e6f7a8b9c0d1
                    from: operator
                    author: { id: 66e0aa11bb22cc33dd44ee55, name: Jonas Weber, avatar: '' }
                    text: Yes! I've switched you over, the invoice follows by email.
                    attachments:
                      - { id: 66f1a2b3c4d5e6f7a8b9c2f0, name: invoice-2026-10.pdf, size: 48213, type: application/pdf }
                    actions: []
                    via: ''
                    created_at: '2026-10-14T09:15:30.000Z'
                pagination: { page: 1, limit: 20, total: 2, has_more: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message as operator, bot or private note
      description: |
        `operator` and `bot` messages are shown to the visitor and fire the `message.sent` webhook; `note`
        messages are internal only. To post as the visitor, use `POST /api/v1/inbound`.
      security:
        - bearerAuth: []
        - oauth2: [messages:write]
      x-required-scope: messages:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 5000, description: Trimmed before validation. }
                from: { type: string, enum: [operator, bot, note], default: operator }
                author_name: { type: string, maxLength: 60, description: Defaults to the API key or app name. }
                author_avatar: { type: string, format: uri, maxLength: 500 }
            example:
              text: Your order #4821 has shipped 📦
              from: bot
              author_name: Order bot
      responses:
        '201':
          description: The created message.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Message' }
              example:
                data:
                  id: 66f1a2b3c4d5e6f7a8b9c104
                  conversation_id: 66f1a2b3c4d5e6f7a8b9c0d1
                  from: bot
                  author: { id: 'api_key:66f0d3a1b2c3d4e5f6a7b801', name: Order bot, avatar: '' }
                  text: Your order #4821 has shipped 📦
                  attachments: []
                  actions: []
                  via: Shop backend
                  created_at: '2026-10-14T10:02:17.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List or search contacts
      description: Most recently seen first. Contacts merged into another contact are excluded.
      security:
        - bearerAuth: []
        - oauth2: [contacts:read]
      x-required-scope: contacts:read
      parameters:
        - name: email
          in: query
          description: Exact email match (case-insensitive).
          schema: { type: string }
        - name: q
          in: query
          description: Case-insensitive substring match on name or email (first 100 characters used).
          schema: { type: string }
        - name: tag
          in: query
          description: Only contacts with this tag.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of contacts.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Contacts]
      operationId: upsertContact
      summary: Create or update (upsert) a contact
      description: |
        Matches an existing contact by `email` (non-merged), else by exact `external_id`. On a match the contact
        is updated — given fields overwrite, `tags` are added, `data` keys merged — and `200` is returned with
        `merged: true`. Otherwise a new contact (`source: api`) is created and `201` is returned.
        At least one of `email`, `name` or `external_id` is required.
      security:
        - bearerAuth: []
        - oauth2: [contacts:write]
      x-required-scope: contacts:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
            example:
              email: maya.fischer@example.test
              name: Maya Fischer
              tags: [customer]
              data: { plan: pro, seats: 5 }
              external_id: cus_8842
      responses:
        '200':
          description: An existing contact was updated.
          content:
            application/json:
              schema:
                type: object
                required: [data, merged]
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
                  merged: { type: boolean, const: true }
        '201':
          description: A new contact was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
              example:
                data:
                  $ref: '#/components/examples/ContactValue/value'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Contact ID.
        schema: { $ref: '#/components/schemas/ObjectId' }
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact
      description: Also returns contacts that were merged into another contact.
      security:
        - bearerAuth: []
        - oauth2: [contacts:read]
      x-required-scope: contacts:read
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
              examples:
                contact:
                  $ref: '#/components/examples/ContactEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Contacts]
      operationId: updateContact
      summary: Update a contact
      description: |
        `tags` replaces the tag list; `data` is merged per key (keys must match `^[A-Za-z0-9_-]{1,60}$`, others
        are dropped). Email uniqueness is not checked.
      security:
        - bearerAuth: []
        - oauth2: [contacts:write]
      x-required-scope: contacts:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
            example:
              company: Fischer Design GmbH
              data: { plan: business }
      responses:
        '200':
          description: The updated contact.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/website:
    get:
      tags: [Website]
      operationId: getWebsite
      summary: Get the token's website and token info
      description: |
        Works with any valid token — no scope is enforced (the `website:read` scope exists but is not required here).
      security:
        - bearerAuth: []
        - oauth2: []
      responses:
        '200':
          description: Website and token information.
          content:
            application/json:
              schema:
                type: object
                required: [data, token]
                properties:
                  data: { $ref: '#/components/schemas/Website' }
                  token:
                    type: object
                    required: [type, name, scopes]
                    properties:
                      type: { type: string, enum: [api_key, app] }
                      name: { type: string, description: API key name or OAuth app name. }
                      scopes:
                        type: array
                        items: { $ref: '#/components/schemas/Scope' }
              example:
                data:
                  id: k7m2p9xq4ram
                  internal_id: 6650a1b2c3d4e5f6a7b8c9d0
                  name: Fischer Design Shop
                  domain: shop.example.test
                  members: 3
                  online: true
                  within_hours: true
                  created_at: '2026-05-04T10:00:00.000Z'
                token:
                  type: api_key
                  name: Shop backend
                  scopes: [conversations:read, messages:write, contacts:read, contacts:write]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhooks
      description: All webhooks of the website (also those created in the dashboard or by other apps), newest first.
      security:
        - bearerAuth: []
        - oauth2: [webhooks:manage]
      x-required-scope: webhooks:manage
      responses:
        '200':
          description: The webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
              example:
                data:
                  - $ref: '#/components/examples/WebhookValue/value'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe a URL to events
      description: |
        Returns the signing secret once, in `secret`. Deliveries are `POST`ed JSON
        `{ id, event, website_id, created_at, data }` signed with
        `Hearthly-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, "<t>.<body>")>`.
        Max 25 webhooks per website. In production, URLs resolving to private network addresses are rejected
        unless the server sets `ALLOW_PRIVATE_URLS=true`.
      security:
        - bearerAuth: []
        - oauth2: [webhooks:manage]
      x-required-scope: webhooks:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, maxLength: 1000, pattern: '^https?://' }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                description: { type: string, maxLength: 200, default: '' }
            example:
              url: https://bridge.example.test/hearthly
              events: [message.sent]
              description: Telegram bridge
      responses:
        '201':
          description: The webhook and its signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [data, secret]
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }
                  secret: { type: string, description: 'Signing secret (`whsec_…`). Shown only once.' }
              example:
                data:
                  $ref: '#/components/examples/WebhookValue/value'
                secret: whsec_Q2x8Vb4nR7kT1mZp9sWc3yLd6fHg
        '400':
          description: 'Body is not valid JSON, the URL is not allowed (private address), or the 25-webhook limit was reached (`bad_request`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: bad_request, message: Limit of 25 webhooks per website }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      description: Deletes the webhook and its delivery history.
      security:
        - bearerAuth: []
        - oauth2: [webhooks:manage]
      x-required-scope: webhooks:manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
              example: { deleted: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/inbound:
    post:
      tags: [Inbound]
      operationId: postInboundMessage
      summary: Post a visitor message from a custom channel
      description: |
        Lets a bridge (Telegram, Slack, WhatsApp, SMS, email…) post a message **from the end user** into Hearthly.

        Contact matching (unless `conversation_id` is given): first by `external_id` stored as
        `<channel>:<contact.external_id>`, then by `contact.email`; otherwise a new contact is created
        (`source: channel:<channel>`, tagged with the channel). Existing contacts are not updated.

        Conversation: `conversation_id` if given; otherwise the contact's current conversation if it is not
        resolved and is on the same channel; otherwise a new conversation on that channel.

        Fires `message.received` (and `contact.created` / `conversation.created` when applicable). Operator and bot
        replies come back through the `message.sent` webhook — filter on `data.conversation.channel`.

        `data.conversation` in the response is the visitor-facing slice and reflects the state *before* this
        message was stored.
      security:
        - bearerAuth: []
        - oauth2: [messages:write]
      x-required-scope: messages:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                channel:
                  type: string
                  pattern: '^[a-z0-9_-]{2,30}$'
                  default: api
                  description: Trimmed and lower-cased before validation.
                conversation_id:
                  $ref: '#/components/schemas/ObjectId'
                contact:
                  type: object
                  description: Required unless `conversation_id` is given; must contain `external_id` or `email`.
                  default: {}
                  properties:
                    external_id: { type: string, maxLength: 100 }
                    email: { type: string, format: email, maxLength: 200 }
                    name: { type: string, maxLength: 100 }
                    phone: { type: string, maxLength: 40 }
                text: { type: string, minLength: 1, maxLength: 5000 }
            example:
              channel: telegram
              contact: { external_id: '518822034', name: Maya Fischer }
              text: Hi! Is the oak desk still in stock?
      responses:
        '201':
          description: The stored visitor message.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message, conversation, conversation_id, contact_id]
                    properties:
                      message: { $ref: '#/components/schemas/Message' }
                      conversation: { $ref: '#/components/schemas/VisitorConversation' }
                      conversation_id: { $ref: '#/components/schemas/ObjectId' }
                      contact_id: { $ref: '#/components/schemas/ObjectId' }
              example:
                data:
                  message:
                    id: 66f3c4d5e6f7a8b9c0d1e201
                    conversation_id: 66f3c4d5e6f7a8b9c0d1e101
                    from: visitor
                    author: { id: 66f3c4d5e6f7a8b9c0d1e001, name: Maya Fischer, avatar: '' }
                    text: Hi! Is the oak desk still in stock?
                    attachments: []
                    actions: []
                    via: telegram (Telegram bridge)
                    created_at: '2026-10-14T14:00:00.000Z'
                  conversation: { id: 66f3c4d5e6f7a8b9c0d1e101, status: open, unread: 0, rating: null, created_at: '2026-10-14T14:00:00.000Z' }
                  conversation_id: 66f3c4d5e6f7a8b9c0d1e101
                  contact_id: 66f3c4d5e6f7a8b9c0d1e001
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/oauth/token:
    post:
      tags: [OAuth]
      operationId: oauthToken
      summary: OAuth 2.0 token endpoint
      description: |
        - `grant_type=authorization_code`: `code`, `redirect_uri` (must equal the one used at authorization),
          `client_id`, and either `client_secret` or `code_verifier` (PKCE). Codes are single-use and expire after
          10 minutes. A client that doesn't send its secret must have used PKCE.
        - `grant_type=refresh_token`: `refresh_token`, `client_id` (+ `client_secret` if you have one).
          Refresh tokens rotate: the old access/refresh pair is revoked.

        Client credentials may be sent in the body or with HTTP Basic auth (`client_id:client_secret`,
        URL-encoded). Access tokens (`hly_at_…`) last 1 hour; refresh tokens (`hly_rt_…`) 90 days.
        The body may be `application/x-www-form-urlencoded` (per spec) or JSON.
        Rate limited to 30 requests burst / 1 request per 2 seconds per client IP (`slow_down`, 429).
      security:
        - {}
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              authorizationCode:
                summary: Authorization code with PKCE
                value:
                  grant_type: authorization_code
                  code: hly_code_3vX9qLm2Rk8sT1pZ4wYb7nCd5fGh0jKa
                  redirect_uri: https://app.example.test/callback
                  client_id: hly_app_k2m7p4q9r3s8t6v5
                  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
              refresh:
                summary: Refresh
                value:
                  grant_type: refresh_token
                  refresh_token: hly_rt_8fK2pQ9sL4mN7vB1xC6zR3tY5wD0hJgA
                  client_id: hly_app_k2m7p4q9r3s8t6v5
                  client_secret: hly_cs_Zp4Lq8Wm2Xv6Ns1Rt9Kc3Yb7Hd5Fg0Ja
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Tokens issued.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example:
                access_token: hly_at_mQ3vR8kL2pX7sN4tZ9wB1cY6dF5gH0jK
                token_type: Bearer
                expires_in: 3600
                refresh_token: hly_rt_aB4cD8eF2gH6jK1mN5pQ9rS3tV7wX0yZ
                scope: conversations:read messages:write
                website_id: 6650a1b2c3d4e5f6a7b8c9d0
        '400':
          description: '`invalid_grant` (unknown, used, expired or mismatched code / refresh token, revoked installation), `invalid_request` (missing `redirect_uri`) or `unsupported_grant_type`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: invalid_grant }
        '401':
          description: '`invalid_client` — unknown client, wrong secret, or a client without secret that did not use PKCE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: invalid_client, error_description: Unknown client or bad client_secret }
        '429':
          description: '`slow_down` — too many token requests from this IP.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: slow_down }
        '500':
          description: '`server_error`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /api/oauth/revoke:
    post:
      tags: [OAuth]
      operationId: oauthRevoke
      summary: Revoke a token (RFC 7009)
      description: |
        Revokes an access token or refresh token of this client. Either one revokes the whole access/refresh pair.
        Unknown tokens also return 200. Client authentication as for the token endpoint (body or HTTP Basic);
        only `client_id` is strictly required. Body may be form-encoded or JSON.
      security:
        - {}
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/RevokeRequest' }
            example:
              token: hly_rt_aB4cD8eF2gH6jK1mN5pQ9rS3tV7wX0yZ
              client_id: hly_app_k2m7p4q9r3s8t6v5
              client_secret: hly_cs_Zp4Lq8Wm2Xv6Ns1Rt9Kc3Yb7Hd5Fg0Ja
          application/json:
            schema: { $ref: '#/components/schemas/RevokeRequest' }
      responses:
        '200':
          description: Revoked (or the token was unknown). Empty body.
        '401':
          description: Unknown client or wrong client secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: invalid_client }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'A workspace API key (`hly_key_…`) or an OAuth access token (`hly_at_…`). Required scopes are listed per operation (`x-required-scope`).'
    oauth2:
      type: oauth2
      description: Authorization-code flow (PKCE supported, S256 or plain). Only website owners/admins can approve an installation.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:3005/oauth/authorize
          tokenUrl: http://localhost:3005/api/oauth/token
          refreshUrl: http://localhost:3005/api/oauth/token
          scopes:
            conversations:read: Read conversations and messages
            conversations:write: Update conversations (assign, resolve, tag)
            messages:write: Send messages as an operator or bot, and post inbound visitor messages
            contacts:read: Read contacts and their activity
            contacts:write: Create and update contacts
            webhooks:manage: Create and delete webhooks
            website:read: Read basic website information
    clientBasic:
      type: http
      scheme: basic
      description: OAuth client authentication — `client_id:client_secret` (alternative to sending them in the body).
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based).
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation ID.
      schema: { $ref: '#/components/schemas/ObjectId' }
  headers:
    X-RateLimit-Limit:
      description: Burst size (120).
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests left in the bucket.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }
  responses:
    BadRequest:
      description: Body is not valid JSON (`bad_request`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: bad_request, message: Invalid JSON body }
    TooLarge:
      description: Body larger than 256 KB (`bad_request`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: bad_request, message: Body too large }
    Unauthorized:
      description: Missing, invalid, expired or revoked token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unauthorized, message: 'Invalid, expired or revoked token' }
    InsufficientScope:
      description: The token lacks the required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: insufficient_scope, message: This token lacks the "conversations:read" scope }
    NotFound:
      description: The resource doesn't exist on this website (or the ID is malformed).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_found, message: Conversation not found }
    ValidationFailed:
      description: 'Body failed validation. `message` lists the issues as `path: message` joined by `; `.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: validation_failed, message: 'text: String must contain at least 1 character(s)' }
    RateLimited:
      description: Rate limit exceeded (burst 120, 2 req/s sustained, per token).
      headers:
        X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: 'Rate limit exceeded (burst 120, 2 req/s sustained)' }
  examples:
    ContactValue:
