name: Bug report
description: Something in Hearthly doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! For security issues use [private reporting](https://github.com/amanjhacodes55/hearthly/security/advisories/new) instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the inbox\n2. …"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Inbox, Widget, Contacts & segments, Automations / campaigns, Knowledge base, Analytics, REST API / webhooks / OAuth, Deployment (Docker / Render), Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "main @ abc1234"
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "Docker on Render, Node 20, MongoDB Atlas M0, Chrome 130 on macOS"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
